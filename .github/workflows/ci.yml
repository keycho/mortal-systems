name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # branded chrome ≥137 stopped honoring --load-extension and 141 removed
      # the DisableLoadExtensionCommandLineSwitch escape hatch, so the runner's
      # google chrome can no longer load the companion (risk r3, observed here
      # 2026-08-05: "companion never appeared in the browser's target list").
      # the browser suites run against playwright's chromium instead — the same
      # browser the local dev environment pins, version-matched to the repo's
      # playwright-core dependency.
      - name: chromium for browser suites (branded chrome cannot load the companion)
        run: |
          # ubuntu 24 restricts unprivileged user namespaces; deb chrome has a
          # setuid sandbox helper, playwright's chromium does not — lift the
          # restriction so its sandbox can start (no-op where already lifted)
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          pnpm --filter mortal-tests exec playwright-core install --with-deps chromium
          BROWSER="$(cd tests && node -e 'console.log(require("playwright-core").chromium.executablePath())')"
          test -x "$BROWSER"
          # boot-proof: if this chromium cannot start here, fail NOW with its
          # own stderr in the log, not later as an opaque cdp timeout
          timeout 60 "$BROWSER" --headless=new --disable-gpu --no-first-run --user-data-dir="$RUNNER_TEMP/chromium-boot-proof" --dump-dom about:blank > /dev/null
          echo "MORTAL_BROWSER_PATH=$BROWSER" >> "$GITHUB_ENV"
      - run: pnpm build
      # full suites, including real-chromium isolation/lifecycle, headless
      - run: pnpm test
        env:
          MORTAL_HEADLESS: "1"
      # lint + typecheck + guarantees gate + BOOT THE ACTUAL CLI. the cli
      # smoke runs the built artifact the way a user does — vitest alone
      # cannot see stale/broken dist output because turbo rebuilds deps
      # before every test run.
      - run: pnpm check
        env:
          MORTAL_HEADLESS: "1"

  # the true clean-clone path, on every push. four fresh-clone resolution
  # failures reached a dev machine that warm checkouts could never reproduce
  # (stale schema dist in dev, schema dist on vercel's filtered install, empty
  # packages/mcp/node_modules, the mortal bin-link gap): this job is the
  # manual wipe-install-build-check verification made permanent. deliberately
  # cache-free — nothing restored, nothing warm — and it exercises the
  # DOCUMENTED entry points (pnpm exec mortal), which is where the bin-link
  # class lives and which the smoke's direct `node dist/cli.js` cannot see.
  clean-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # no pnpm cache on purpose: the point of this job is coldness
      - run: git clean -dxf
      - run: pnpm install --frozen-lockfile
      # same pinned chromium as the gate job: the mortal cli smoke inside
      # pnpm check launches a real browser, and the runner's branded chrome
      # cannot load the companion (see the gate job's note)
      - name: chromium for browser suites
        run: |
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          pnpm --filter mortal-tests exec playwright-core install --with-deps chromium
          BROWSER="$(cd tests && node -e 'console.log(require("playwright-core").chromium.executablePath())')"
          test -x "$BROWSER"
          timeout 60 "$BROWSER" --headless=new --disable-gpu --no-first-run --user-data-dir="$RUNNER_TEMP/chromium-boot-proof" --dump-dom about:blank > /dev/null
          echo "MORTAL_BROWSER_PATH=$BROWSER" >> "$GITHUB_ENV"
      # the committed bin shim must be linked at install time — before any
      # dist exists — and must refuse honestly rather than ERR_MODULE_NOT_FOUND
      - name: bin linked and honest before build
        run: |
          set +e
          out=$(pnpm exec mortal 2>&1); code=$?
          set -e
          echo "$out"
          test "$code" -ne 0
          echo "$out" | grep -q "not built yet"
      - run: pnpm build
      - name: documented entry point works after build
        run: pnpm exec mortal --version
      - run: pnpm check
        env:
          MORTAL_HEADLESS: "1"
