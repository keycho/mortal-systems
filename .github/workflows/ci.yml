name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # full suites, including real-chromium isolation/lifecycle (the ubuntu
      # runner ships google chrome; discovery finds it, launches are headless)
      - run: pnpm test
        env:
          MORTAL_HEADLESS: "1"
      # lint + typecheck + guarantees gate + BOOT THE ACTUAL CLI. the cli
      # smoke runs the built artifact the way a user does — vitest alone
      # cannot see stale/broken dist output because turbo rebuilds deps
      # before every test run.
      - run: pnpm check
        env:
          MORTAL_HEADLESS: "1"
