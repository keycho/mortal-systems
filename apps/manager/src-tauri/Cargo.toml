# mortal manager — tauri 2 shell.
#
# STATUS: compiled + launch-smoked by release ci on the macos runner
# (release-macos.yml). still not compilable in the linux dev container
# (webkit2gtk system dependencies are absent there). target platform is
# macos. see docs/PROGRESS.md and docs/DECISIONS.md.

[package]
name = "mortal-manager"
version = "0.1.0"
description = "mortal manager — desktop interface for the mortal runtime"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[lib]
name = "mortal_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
